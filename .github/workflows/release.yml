name: Release Chrome extension

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check release version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('public/manifest.json', 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          if (tag !== `v${manifest.version}` || manifest.version !== pkg.version) {
            throw new Error(`Tag ${tag}, manifest version ${manifest.version}, and npm version ${pkg.version} must match.`);
          }
          NODE
      - run: npm ci
      - run: npm run check
      - name: Package extension
        working-directory: dist
        run: |
          zip -qr "$RUNNER_TEMP/Meetkeep-extension.zip" .
          unzip -tq "$RUNNER_TEMP/Meetkeep-extension.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$RUNNER_TEMP/Meetkeep-extension.zip"
          if assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'); then
            if ! grep -Fxq 'Meetkeep-extension.zip' <<< "$assets"; then
              gh release upload "$GITHUB_REF_NAME" "$asset"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --verify-tag --generate-notes --title "Meetkeep $GITHUB_REF_NAME"
          fi
